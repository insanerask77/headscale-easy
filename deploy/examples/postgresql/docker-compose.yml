# Headscale Easy with an external PostgreSQL instead of SQLite
# https://github.com/insanerask77/headscale-easy
#
#   cp .env.example .env     # set the three passwords and HSE_PUBLIC_URL
#   docker compose up -d
#
# PostgreSQL here is a container for the example. Use your own server instead by deleting the `postgres`
# service and the `depends_on`, and pointing HEADSCALE_PG_HOST at it. Headscale (and only Headscale) writes
# to the database as its owner role; the console reads it with a read-only role the image creates itself.
name: headscale-easy-pg

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-17}-alpine
    container_name: headscale-easy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: headscale
      POSTGRES_DB: headscale
      POSTGRES_PASSWORD: ${HEADSCALE_PG_PASS:?set HEADSCALE_PG_PASS in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U headscale -d headscale"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  headscale-easy:
    image: ghcr.io/insanerask77/headscale-easy:${HSE_VERSION:-latest}
    container_name: headscale-easy
    restart: unless-stopped
    env_file: .env
    environment:
      HEADSCALE_DB_TYPE: postgres
      HEADSCALE_PG_HOST: postgres
      HEADSCALE_PG_NAME: headscale
      HEADSCALE_PG_USER: headscale
      HEADSCALE_PG_SSLMODE: disable    # same host, same network. Use "require" or "verify-full" for a remote server
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${HSE_HTTP_PORT:-80}:80"
      - "${HSE_HTTPS_PORT:-443}:443"
      - "${HSE_HTTPS_PORT:-443}:443/udp"
      - "3478:3478/udp"
    volumes:
      - hse-data:/data
      - hse-backups:/data/backups
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  pgdata:
  hse-data:
  hse-backups:
