# =============================================================================
# vpn.example.com — Headscale Easy
# =============================================================================
# Copy it to the proxy machine, usually as
# /etc/nginx/conf.d/vpn.example.com.conf, and reload:
#
#   nginx -t && systemctl reload nginx
#
# Behind it the Headscale Easy image already routes by path (/ -> Headscale,
# /admin -> web UI), so ONE upstream is enough: the whole domain is forwarded.
#
# Replace: vpn.example.com (your domain), AIO_HOST:8080 (where the image listens:
# the host and the HSE_HTTP_PORT you published). In the image's .env:
#   HSE_PUBLIC_URL=https://vpn.example.com
#   HSE_TLS=off
#   HSE_TRUSTED_PROXIES=<this proxy's address>/32     <- the proxy ONLY, not its network
#
# DERP: the image listens for STUN on UDP 3478 and that does NOT go through
# nginx. Publish that port straight to AIO_HOST (firewall / router), or choose the
# public relays in the setup wizard (HSE_DERP_MODE=public).

# 'Connection' must be empty on normal requests and "upgrade" only when the client
# asks. A conf.d file is included inside http{}, so the map can live here. It has to
# come BEFORE the server blocks that use it (nginx refuses an unknown variable). If
# your nginx.conf already defines $connection_upgrade, delete this block (nginx
# rejects duplicates).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream headscale_stack {
    server AIO_HOST:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name vpn.example.com;

    # certbot's HTTP-01 challenge, if you use it
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vpn.example.com;

    # Point these at your certificates (certbot, acme.sh...)
    ssl_certificate     /etc/letsencrypt/live/vpn.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vpn.example.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Tailscale clients upload large network maps; without this nginx returns 413
    client_max_body_size 0;

    access_log /var/log/nginx/vpn.example.com.access.log;
    error_log  /var/log/nginx/vpn.example.com.error.log;

    location / {
        proxy_pass http://headscale_stack;

        # /ts2021 (the control protocol) runs over an "upgraded" connection.
        # HTTP/2 forbids Upgrade/Connection headers, so the hop to the backend
        # MUST be HTTP/1.1.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # /machine/map keeps the connection open to push network changes.
        # With the default 60 s read timeout nodes would reconnect every
        # minute; with buffering, changes would arrive late.
        proxy_buffering    off;
        proxy_request_buffering off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
