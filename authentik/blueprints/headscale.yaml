# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
#
# Headscale Easy — Authentik blueprint
# https://github.com/insanerask77/headscale-easy
#
# Applied by the Authentik worker on start-up and whenever this file changes
# (install.sh also forces it, because a change of environment variables alone
# does not trigger a re-apply). Mounted at /blueprints/custom/.
#
# Creates:
#   - Groups 'headscale-users' (can join the tailnet) and 'vpn-admins' (also
#     administer it from the web UI)
#   - Two OIDC providers, each with its application:
#       headscale       the tailnet ('tailscale up')
#       headscale-easy  the web UI (the admin role comes from the groups)
#   - The "Headscale Easy" theme and the add-user form
#   - With GOOGLE_CLIENT_ID set: "Sign in with Google"
#   - Removes what earlier versions of the project created (Headplane, Mi VPN)
#
# Values that change per install come from environment variables (!Env), so
# this file is the same for every installation.

version: 1
metadata:
  name: Headscale Easy
  labels:
    blueprints.goauthentik.io/description: "Headscale Easy: OIDC for Headscale and its web UI, theme and add-user form"

context:
  public_url: !Env [HEADSCALE_PUBLIC_URL, "http://localhost"]
  google_client_id: !Env [GOOGLE_CLIENT_ID, ""]

entries:
  # ---------------------------------------------------------------------------
  # Dependencies: the default flows, mappings and brand referenced below are
  # created by other blueprints, in no guaranteed order on first start.
  # ---------------------------------------------------------------------------
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: System - OAuth2 Provider - Scopes
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Authentication flow
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider authorization flow (implicit consent)
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider invalidation flow
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Invalidation flow
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Brand
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    conditions:
      - !Context google_client_id
    attrs:
      identifiers:
        name: Default - Source authentication flow
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    conditions:
      - !Context google_client_id
    attrs:
      identifiers:
        name: Default - Source enrollment flow
      required: true

  # ---------------------------------------------------------------------------
  # Groups. 'created': only created here; members are managed in Authentik and
  # never overwritten when the blueprint is applied again.
  # ---------------------------------------------------------------------------
  - model: authentik_core.group
    state: created
    id: group-users
    identifiers:
      name: headscale-users
  - model: authentik_core.group
    state: created
    id: group-admins
    identifiers:
      name: vpn-admins

  # ---------------------------------------------------------------------------
  # The tailnet: Headscale's OIDC provider ('tailscale up' opens this sign-in)
  # ---------------------------------------------------------------------------
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: headscale
    attrs:
      client_type: confidential
      # Required in blueprints: the UI fills it in, but left empty Authentik
      # rejects sign-ins with "Invalid grant_type for provider".
      grant_types:
        - authorization_code
        - refresh_token
      client_id: !Env OIDC_CLIENT_ID
      client_secret: !Env OIDC_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # Headscale does not support JWE: leave the encryption key empty
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      # Issuer = <public_url>/authentik/application/o/headscale/
      issuer_mode: per_provider
      include_claims_in_id_token: true
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      redirect_uris:
        - matching_mode: strict
          url: !Format ["%s/oidc/callback", !Context public_url]
          redirect_uri_type: authorization

  - model: authentik_core.application
    id: app
    identifiers:
      slug: headscale
    attrs:
      name: Tailnet
      provider: !KeyOf provider
      # Not launched from the browser: 'tailscale up' opens the sign-in
      meta_hide: true
      meta_description: "Device sign-in to the tailnet"
      # Being in ONE of the groups bound below is enough
      policy_engine_mode: any

  # Who may authorize against the application. Without these bindings any
  # Authentik user, including one just created through Google, would get in.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app
      order: 0
    attrs:
      group: !KeyOf group-users
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app
      order: 1
    attrs:
      group: !KeyOf group-admins
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app
      order: 2
    attrs:
      group: !Find [authentik_core.group, [name, "authentik Admins"]]

  # ---------------------------------------------------------------------------
  # The web UI (members: their machines; admins: everything)
  # ---------------------------------------------------------------------------
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-web
    identifiers:
      name: headscale-easy
    attrs:
      client_type: confidential
      grant_types:
        - authorization_code
      client_id: !Env PORTAL_OIDC_CLIENT_ID
      client_secret: !Env PORTAL_OIDC_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      # Logging out of the UI ends the Authentik session too (UserLogoutStage).
      # The providers' default flow only says "you left the app" and keeps the
      # session alive, so switching users would not be possible.
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      issuer_mode: per_provider
      # The UI finds the member's Headscale user by 'sub', which in this mode
      # is a hash of the user and matches the one Headscale received.
      sub_mode: hashed_user_id
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      redirect_uris:
        - matching_mode: strict
          url: !Format ["%s/admin/callback", !Context public_url]
          redirect_uri_type: authorization
        - matching_mode: strict
          url: !Format ["%s/admin/", !Context public_url]
          redirect_uri_type: logout

  - model: authentik_core.application
    id: app-web
    identifiers:
      slug: headscale-easy
    attrs:
      name: Headscale Easy
      provider: !KeyOf provider-web
      meta_launch_url: !Format ["%s/admin/", !Context public_url]
      meta_description: "Your machines and the tailnet admin console"
      meta_publisher: "Headscale Easy by Rafa Madolell"
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-web
      order: 0
    attrs:
      group: !KeyOf group-users
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-web
      order: 1
    attrs:
      group: !KeyOf group-admins
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-web
      order: 2
    attrs:
      group: !Find [authentik_core.group, [name, "authentik Admins"]]

  # ---------------------------------------------------------------------------
  # Sign in with Google (only when GOOGLE_CLIENT_ID is set)
  # ---------------------------------------------------------------------------
  # Google has no user name: the email is used so it is not asked for.
  - model: authentik_sources_oauth.oauthsourcepropertymapping
    id: google-username
    conditions:
      - !Context google_client_id
    identifiers:
      name: "Google: username = email"
    attrs:
      expression: |
        return {"username": info.get("email")}

  - model: authentik_sources_oauth.oauthsource
    id: google-source
    conditions:
      - !Context google_client_id
    identifiers:
      slug: google
    attrs:
      name: Google
      enabled: true
      provider_type: google
      consumer_key: !Context google_client_id
      consumer_secret: !Env [GOOGLE_CLIENT_SECRET, ""]
      authentication_flow: !Find [authentik_flows.flow, [slug, default-source-authentication]]
      enrollment_flow: !Find [authentik_flows.flow, [slug, default-source-enrollment]]
      # A Google account with the same email as a local user signs in as that
      # user. Google verifies emails, so this is safe as long as local users'
      # emails are real.
      user_matching_mode: email_link
      user_property_mappings:
        - !KeyOf google-username

  # "Google" button on the sign-in page (replaces the sources of the default
  # identification stage).
  - model: authentik_stages_identification.identificationstage
    conditions:
      - !Context google_client_id
    identifiers:
      name: default-authentication-identification
    attrs:
      sources:
        - !KeyOf google-source

  # ---------------------------------------------------------------------------
  # "Headscale Easy" theme (Tailscale look, dark and light)
  # ---------------------------------------------------------------------------
  # Files live in authentik/branding/. Logo, favicon and background are served
  # by Authentik from media/public/branding (mounted on the server); the CSS
  # is embedded here with !File (mounted on the worker, which applies this).
  - model: authentik_brands.brand
    identifiers:
      domain: authentik-default
    attrs:
      branding_title: Headscale Easy
      # %(theme)s -> logo-light.svg / logo-dark.svg for the active theme
      branding_logo: branding/logo-%(theme)s.svg
      branding_favicon: branding/favicon.svg
      branding_default_flow_background: branding/background.svg
      branding_custom_css: !File [/branding/custom.css, ""]
      # Dark or light following the browser; each user can pin it in their
      # Authentik settings. The CSS defines both variants.
      attributes:
        settings:
          theme:
            base: automatic

  - model: authentik_flows.flow
    identifiers:
      slug: default-authentication-flow
    attrs:
      title: Sign in
      layout: stacked

  # ---------------------------------------------------------------------------
  # Add-user form for admins
  # ---------------------------------------------------------------------------
  # At <public_url>/add-user (redirects to this flow) so members of vpn-admins
  # can create accounts without the Authentik admin interface. It asks for
  # name, user name, email, password and access (tailnet only, or tailnet +
  # admin) and puts the user in the matching group.
  - model: authentik_policies_password.passwordpolicy
    id: add-user-password-policy
    identifiers:
      name: "Headscale Easy: add-user password"
    attrs:
      password_field: password
      length_min: 10
      amount_digits: 0
      amount_uppercase: 0
      amount_lowercase: 0
      amount_symbols: 0
      check_static_rules: true
      check_have_i_been_pwned: false
      check_zxcvbn: false
      error_message: The password must be at least 10 characters long.

  - model: authentik_stages_prompt.prompt
    id: add-user-name
    identifiers:
      name: headscale-easy-add-user-name
    attrs:
      field_key: name
      label: Full name
      type: text
      required: true
      placeholder: Ada Lovelace
      order: 0
  - model: authentik_stages_prompt.prompt
    id: add-user-username
    identifiers:
      name: headscale-easy-add-user-username
    attrs:
      field_key: username
      label: User name
      # 'username' also checks it is not taken
      type: username
      required: true
      placeholder: ada
      sub_text: Used to sign in; also their user name in Headscale.
      order: 1
  - model: authentik_stages_prompt.prompt
    id: add-user-email
    identifiers:
      name: headscale-easy-add-user-email
    attrs:
      field_key: email
      label: Email
      type: email
      required: true
      placeholder: ada@example.com
      sub_text: Can also be used to sign in.
      order: 2
  - model: authentik_stages_prompt.prompt
    id: add-user-password
    identifiers:
      name: headscale-easy-add-user-password
    attrs:
      field_key: password
      label: Password
      type: password
      required: true
      placeholder: At least 10 characters
      order: 3
  # Two password fields: Authentik checks on its own that they match
  - model: authentik_stages_prompt.prompt
    id: add-user-password-repeat
    identifiers:
      name: headscale-easy-add-user-password-repeat
    attrs:
      field_key: password_repeat
      label: Repeat password
      type: password
      required: true
      placeholder: Repeat password
      order: 4
  - model: authentik_stages_prompt.prompt
    id: add-user-role
    identifiers:
      name: headscale-easy-add-user-role
    attrs:
      # 'rol' is not a user field: user_write discards it; only the
      # add-user-group policy reads it to pick the group.
      field_key: rol
      label: Access
      type: radio-button-group
      required: true
      placeholder_expression: true
      placeholder: |
        return [
            {"label": "Member: can connect their own devices", "value": "headscale-users"},
            {"label": "Admin: manages the whole tailnet", "value": "vpn-admins"},
        ]
      initial_value: headscale-users
      order: 5

  - model: authentik_stages_prompt.promptstage
    id: add-user-prompt
    identifiers:
      name: headscale-easy-add-user-prompt
    attrs:
      fields:
        - !KeyOf add-user-name
        - !KeyOf add-user-username
        - !KeyOf add-user-email
        - !KeyOf add-user-password
        - !KeyOf add-user-password-repeat
        - !KeyOf add-user-role
      validation_policies:
        - !KeyOf add-user-password-policy

  # ALWAYS creates a new user: the admin filling in the form is signed in and,
  # without always_create, the data would be written over their own account.
  - model: authentik_stages_user_write.userwritestage
    id: add-user-write
    identifiers:
      name: headscale-easy-add-user-write
    attrs:
      user_creation_mode: always_create
      create_users_as_inactive: false
      user_type: internal

  # Final screen: confirms; "Continue" goes to Users in the web UI
  - model: authentik_stages_prompt.prompt
    id: add-user-done-field
    identifiers:
      name: headscale-easy-add-user-done
    attrs:
      field_key: done
      label: User created
      type: alert_info
      required: false
      initial_value_expression: true
      initial_value: |
        return f"User «{prompt_context.get('username', '')}» created. They can now sign in to Headscale Easy and connect their devices. To add someone else, open /add-user again."
      order: 0
  - model: authentik_stages_prompt.promptstage
    id: add-user-done
    identifiers:
      name: headscale-easy-add-user-done
    attrs:
      fields:
        - !KeyOf add-user-done-field
  - model: authentik_stages_redirect.redirectstage
    id: add-user-back
    identifiers:
      name: headscale-easy-add-user-back
    attrs:
      mode: static
      target_static: !Format ["%s/admin/users", !Context public_url]
      keep_context: false

  - model: authentik_flows.flow
    id: flow-add-user
    identifiers:
      slug: headscale-easy-add-user
    attrs:
      name: "Headscale Easy: add user"
      title: Add user
      designation: enrollment
      # Signed-in users only; which ones is decided by the bindings
      authentication: require_authenticated
      denied_action: message
      policy_engine_mode: any
      layout: stacked

  # Who may use the form
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf flow-add-user
      order: 0
    attrs:
      group: !KeyOf group-admins
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf flow-add-user
      order: 1
    attrs:
      group: !Find [authentik_core.group, [name, "authentik Admins"]]

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-add-user
      order: 10
    attrs:
      stage: !KeyOf add-user-prompt
  - model: authentik_flows.flowstagebinding
    id: add-user-write-binding
    identifiers:
      target: !KeyOf flow-add-user
      order: 20
    attrs:
      stage: !KeyOf add-user-write
      # The group policy needs the form data, which does not exist at planning
      # time: it is evaluated right before this stage.
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-add-user
      order: 30
    attrs:
      stage: !KeyOf add-user-done
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-add-user
      order: 40
    attrs:
      stage: !KeyOf add-user-back

  # Turns the chosen access into a group. user_write adds the user to the
  # groups found in the flow context under "groups".
  - model: authentik_policies_expression.expressionpolicy
    id: add-user-group
    identifiers:
      name: headscale-easy-add-user-group
    attrs:
      expression: |
        from authentik.core.models import Group

        rol = request.context.get("prompt_data", {}).get("rol")
        if rol not in ("headscale-users", "vpn-admins"):
            ak_message("Invalid access")
            return False
        request.context["flow_plan"].context["groups"] = [Group.objects.get(name=rol)]
        return True
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf add-user-write-binding
      order: 0
    attrs:
      policy: !KeyOf add-user-group

  # Shortcut in the Authentik app library, visible only to who may use it
  - model: authentik_core.application
    id: app-add-user
    identifiers:
      slug: headscale-easy-add-user
    attrs:
      name: Add user
      meta_launch_url: !Format ["%s/add-user", !Context public_url]
      meta_description: "Create accounts for the tailnet"
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-add-user
      order: 0
    attrs:
      group: !KeyOf group-admins
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-add-user
      order: 1
    attrs:
      group: !Find [authentik_core.group, [name, "authentik Admins"]]

  # ---------------------------------------------------------------------------
  # Clean-up of earlier versions (Headplane, "Mi VPN", Spanish add-user flow)
  # ---------------------------------------------------------------------------
  - model: authentik_core.application
    state: absent
    identifiers:
      slug: headplane
  - model: authentik_providers_oauth2.oauth2provider
    state: absent
    identifiers:
      name: headplane
  - model: authentik_providers_oauth2.scopemapping
    state: absent
    identifiers:
      name: "Headplane: rol"
  - model: authentik_core.group
    state: absent
    identifiers:
      name: headplane-admins
  - model: authentik_core.application
    state: absent
    identifiers:
      slug: mi-vpn
  - model: authentik_providers_oauth2.oauth2provider
    state: absent
    identifiers:
      name: mi-vpn
  - model: authentik_core.application
    state: absent
    identifiers:
      slug: headscale-alta-usuario
  - model: authentik_flows.flow
    state: absent
    identifiers:
      slug: headscale-alta-usuario
  - model: authentik_policies_expression.expressionpolicy
    state: absent
    identifiers:
      name: headscale-alta-grupo
  - model: authentik_stages_prompt.promptstage
    state: absent
    identifiers:
      name: headscale-alta-prompt
  - model: authentik_stages_prompt.promptstage
    state: absent
    identifiers:
      name: headscale-alta-done
  - model: authentik_stages_user_write.userwritestage
    state: absent
    identifiers:
      name: headscale-alta-write
  - model: authentik_stages_redirect.redirectstage
    state: absent
    identifiers:
      name: headscale-alta-again
  - model: authentik_policies_password.passwordpolicy
    state: absent
    identifiers:
      name: "Headscale: contraseña de alta"
  - model: authentik_stages_prompt.prompt
    state: absent
    identifiers:
      name: headscale-alta-name
  - model: authentik_stages_prompt.prompt
    state: absent
    identifiers:
      name: headscale-alta-username
  - model: authentik_stages_prompt.prompt
    state: absent
    identifiers:
      name: headscale-alta-email
  - model: authentik_stages_prompt.prompt
    state: absent
    identifiers:
      name: headscale-alta-password
  - model: authentik_stages_prompt.prompt
    state: absent
    identifiers:
      name: headscale-alta-password-repeat
  - model: authentik_stages_prompt.prompt
    state: absent
    identifiers:
      name: headscale-alta-rol
  - model: authentik_stages_prompt.prompt
    state: absent
    identifiers:
      name: headscale-alta-done
