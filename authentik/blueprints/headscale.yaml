# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
#
# Headscale Easy — Authentik blueprint
# https://github.com/insanerask77/headscale-easy
#
# Applied by the Authentik worker on start-up and whenever this file changes
# (install.sh also forces it, because a change of environment variables alone
# does not trigger a re-apply). Mounted at /blueprints/custom/.
#
# Creates:
#   - Groups 'headscale-users' (can join the tailnet) and 'vpn-admins' (also
#     administer it from the web UI)
#   - Two OIDC providers, each with its application:
#       headscale       the tailnet ('tailscale up')
#       headscale-easy  the web UI (the admin role comes from the groups)
#   - Two-factor authentication in the sign-in flow, and the service account
#     'headscale-easy-web' whose token lets the web UI change its mode
#   - The "Headscale Easy" theme and the add-user form
#   - Invitations (links created from the web UI) and password reset links;
#     with SMTP_HOST set, also "Forgot password?" by email
#   - With GOOGLE_CLIENT_ID set: "Sign in with Google"
#
# Values that change per install come from environment variables (!Env), so
# this file is the same for every installation.

version: 1
metadata:
  name: Headscale Easy
  labels:
    blueprints.goauthentik.io/description: "Headscale Easy: OIDC for Headscale and its web UI, theme and add-user form"

context:
  public_url: !Env [HEADSCALE_PUBLIC_URL, "http://localhost"]
  google_client_id: !Env [GOOGLE_CLIENT_ID, ""]
  # Two-factor authentication: admins (required for admins), everyone, optional.
  # Only the INITIAL value: afterwards admins change it from the web UI.
  mfa_required: !Env [MFA_REQUIRED, admins]
  # API token of the web UI's service account (empty = no token)
  web_token: !Env [PORTAL_AUTHENTIK_TOKEN, ""]
  # Outgoing email (empty = off): "Forgot password?" on the sign-in page
  smtp_host: !Env [SMTP_HOST, ""]

entries:
  # ---------------------------------------------------------------------------
  # Dependencies: the default flows, mappings and brand referenced below are
  # created by other blueprints, in no guaranteed order on first start.
  # ---------------------------------------------------------------------------
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: System - OAuth2 Provider - Scopes
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Authentication flow
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider authorization flow (implicit consent)
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider invalidation flow
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Invalidation flow
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Brand
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    conditions:
      - !Context google_client_id
    attrs:
      identifiers:
        name: Default - Source authentication flow
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    conditions:
      - !Context google_client_id
    attrs:
      identifiers:
        name: Default - Source enrollment flow
      required: true

  # ---------------------------------------------------------------------------
  # Groups. 'created': only created here; members are managed in Authentik and
  # never overwritten when the blueprint is applied again.
  # ---------------------------------------------------------------------------
  - model: authentik_core.group
    state: created
    id: group-users
    identifiers:
      name: headscale-users
  - model: authentik_core.group
    state: created
    id: group-admins
    identifiers:
      name: vpn-admins

  # ---------------------------------------------------------------------------
  # Sign-in and sign-out flows of Headscale Easy
  # ---------------------------------------------------------------------------
  # Authentik re-applies its own default blueprints from time to time and
  # resets anything changed in the default flows (the "Welcome to authentik!"
  # title, the sources of its sign-in page). So Headscale Easy has its own
  # flows, reusing the default stages, and the brand points at them.
  - model: authentik_stages_identification.identificationstage
    id: identification
    identifiers:
      name: headscale-easy-identification
    attrs:
      user_fields:
        - email
        - username
      pretend_user_exists: true
      show_matched_user: true

  - model: authentik_flows.flow
    id: flow-sign-in
    identifiers:
      slug: headscale-easy-sign-in
    attrs:
      name: "Headscale Easy: sign in"
      title: Sign in
      designation: authentication
      authentication: none
      layout: stacked
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-sign-in
      stage: !KeyOf identification
      order: 10
  - model: authentik_flows.flowstagebinding
    id: sign-in-password-binding
    identifiers:
      target: !KeyOf flow-sign-in
      stage: !Find [authentik_stages_password.passwordstage, [name, default-authentication-password]]
      order: 20
    attrs:
      re_evaluate_policies: true
  # Two-factor authentication. After the password, ONE of these two runs,
  # depending on the user (evaluated then, not when the flow starts, because
  # the user is not known yet):
  #   - required: users without a second factor must set one up (TOTP app or
  #     passkey) before they get in;
  #   - optional (Authentik's default stage): asks for the code only if the
  #     user already has a second factor.
  # The mode (admins, everyone or optional) is the first line of the policy
  # below. It is created from MFA_REQUIRED in .env and then belongs to the web
  # UI (Settings -> General), which rewrites that line through Authentik's API:
  # 'state: created' so re-applying this blueprint (on every worker start)
  # never reverts the admin's choice.
  #
  # The web UI's service account: an API token (PORTAL_AUTHENTIK_TOKEN in
  # .env, generated by the installer) that may read and change that one
  # policy, and manage invitations and password reset links (see "Invitations
  # and password reset" at the end).
  - model: authentik_core.user
    id: web-service-account
    identifiers:
      username: headscale-easy-web
    attrs:
      name: Headscale Easy web UI
      type: service_account
      path: goauthentik.io/service-accounts
      is_active: true
  - model: authentik_core.token
    conditions:
      - !Context web_token
    identifiers:
      identifier: headscale-easy-web-api
    attrs:
      intent: api
      expiring: false
      user: !KeyOf web-service-account
      key: !Context web_token
      description: "Headscale Easy web UI: two-factor mode, invitations and password reset links"
  - model: authentik_policies_expression.expressionpolicy
    id: mfa-required-policy
    state: created
    identifiers:
      name: "Headscale Easy: two-factor required for this user"
    permissions:
      - permission: authentik_policies_expression.view_expressionpolicy
        user: !KeyOf web-service-account
      - permission: authentik_policies_expression.change_expressionpolicy
        user: !KeyOf web-service-account
    attrs:
      expression: !Format
        - |
          mode = "%s"
          user = request.context.get("pending_user") or request.user
          if mode == "everyone":
              return True
          if mode != "admins" or not getattr(user, "pk", None):
              return False
          return ak_is_group_member(user, name="vpn-admins") or ak_is_group_member(user, name="authentik Admins")
        - !Context mfa_required
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: mfa-required-stage
    identifiers:
      name: headscale-easy-mfa-required
    attrs:
      device_classes:
        - totp
        - webauthn
        - static
      not_configured_action: configure
      configuration_stages:
        - !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, default-authenticator-totp-setup]]
        - !Find [authentik_stages_authenticator_webauthn.authenticatorwebauthnstage, [name, default-authenticator-webauthn-setup]]
      webauthn_user_verification: preferred

  - model: authentik_flows.flowstagebinding
    id: sign-in-mfa-binding
    identifiers:
      target: !KeyOf flow-sign-in
      stage: !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, default-authentication-mfa-validation]]
      order: 30
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: all
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf sign-in-mfa-binding
      policy: !KeyOf mfa-required-policy
      order: 20
    attrs:
      negate: true
  - model: authentik_flows.flowstagebinding
    id: sign-in-mfa-required-binding
    identifiers:
      target: !KeyOf flow-sign-in
      stage: !KeyOf mfa-required-stage
      order: 31
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
      policy_engine_mode: all
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf sign-in-mfa-required-binding
      policy: !KeyOf mfa-required-policy
      order: 20
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-sign-in
      stage: !Find [authentik_stages_user_login.userloginstage, [name, default-authentication-login]]
      order: 100
  # Same conditions as the default flow: skip the password when the user
  # already authenticated another way (passkey, source)
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf sign-in-password-binding
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, default-authentication-flow-password-stage]]
      order: 10
    attrs:
      failure_result: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf sign-in-mfa-binding
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, default-authentication-flow-authenticator-validate-stage]]
      order: 10
    attrs:
      failure_result: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf sign-in-mfa-required-binding
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, default-authentication-flow-authenticator-validate-stage]]
      order: 10
    attrs:
      failure_result: true

  # Sign out: ends the Authentik session and always returns to the web UI.
  # It needs no token, so it also works after the ID token has expired.
  - model: authentik_stages_user_logout.userlogoutstage
    id: sign-out-stage
    identifiers:
      name: headscale-easy-sign-out
  - model: authentik_stages_redirect.redirectstage
    id: signed-out-stage
    identifiers:
      name: headscale-easy-signed-out
    attrs:
      mode: static
      target_static: !Format ["%s/admin/login?m=signed-out", !Context public_url]
  - model: authentik_flows.flow
    id: flow-sign-out
    identifiers:
      slug: headscale-easy-sign-out
    attrs:
      name: "Headscale Easy: sign out"
      title: Sign out
      designation: invalidation
      authentication: none
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-sign-out
      stage: !KeyOf sign-out-stage
      order: 0
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-sign-out
      stage: !KeyOf signed-out-stage
      order: 10

  # ---------------------------------------------------------------------------
  # The tailnet: Headscale's OIDC provider ('tailscale up' opens this sign-in)
  # ---------------------------------------------------------------------------
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: headscale
    attrs:
      client_type: confidential
      # Required in blueprints: the UI fills it in, but left empty Authentik
      # rejects sign-ins with "Invalid grant_type for provider".
      grant_types:
        - authorization_code
        - refresh_token
      client_id: !Env OIDC_CLIENT_ID
      client_secret: !Env OIDC_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # Headscale does not support JWE: leave the encryption key empty
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      # Issuer = <public_url>/authentik/application/o/headscale/
      issuer_mode: per_provider
      include_claims_in_id_token: true
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      redirect_uris:
        - matching_mode: strict
          url: !Format ["%s/oidc/callback", !Context public_url]
          redirect_uri_type: authorization

  - model: authentik_core.application
    id: app
    identifiers:
      slug: headscale
    attrs:
      name: Tailnet
      provider: !KeyOf provider
      # Not launched from the browser: 'tailscale up' opens the sign-in
      meta_hide: true
      meta_description: "Device sign-in to the tailnet"
      # Being in ONE of the groups bound below is enough
      policy_engine_mode: any

  # Who may authorize against the application. Without these bindings any
  # Authentik user, including one just created through Google, would get in.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app
      order: 0
    attrs:
      group: !KeyOf group-users
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app
      order: 1
    attrs:
      group: !KeyOf group-admins
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app
      order: 2
    attrs:
      group: !Find [authentik_core.group, [name, "authentik Admins"]]

  # ---------------------------------------------------------------------------
  # The web UI (members: their machines; admins: everything)
  # ---------------------------------------------------------------------------
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-web
    identifiers:
      name: headscale-easy
    attrs:
      client_type: confidential
      grant_types:
        - authorization_code
      client_id: !Env PORTAL_OIDC_CLIENT_ID
      client_secret: !Env PORTAL_OIDC_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      # Logging out of the UI ends the Authentik session too (UserLogoutStage).
      # The providers' default flow only says "you left the app" and keeps the
      # session alive, so switching users would not be possible.
      invalidation_flow: !KeyOf flow-sign-out
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      issuer_mode: per_provider
      # The UI finds the member's Headscale user by 'sub', which in this mode
      # is a hash of the user and matches the one Headscale received.
      sub_mode: hashed_user_id
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      redirect_uris:
        - matching_mode: strict
          url: !Format ["%s/admin/callback", !Context public_url]
          redirect_uri_type: authorization
        - matching_mode: strict
          url: !Format ["%s/admin/", !Context public_url]
          redirect_uri_type: logout

  - model: authentik_core.application
    id: app-web
    identifiers:
      slug: headscale-easy
    attrs:
      name: Headscale Easy
      provider: !KeyOf provider-web
      meta_launch_url: !Format ["%s/admin/", !Context public_url]
      meta_description: "Your machines and the tailnet admin console"
      meta_publisher: "Headscale Easy by Rafa Madolell"
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-web
      order: 0
    attrs:
      group: !KeyOf group-users
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-web
      order: 1
    attrs:
      group: !KeyOf group-admins
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-web
      order: 2
    attrs:
      group: !Find [authentik_core.group, [name, "authentik Admins"]]

  # ---------------------------------------------------------------------------
  # Sign in with Google (only when GOOGLE_CLIENT_ID is set)
  # ---------------------------------------------------------------------------
  # Google has no user name: the email is used so it is not asked for.
  - model: authentik_sources_oauth.oauthsourcepropertymapping
    id: google-username
    conditions:
      - !Context google_client_id
    identifiers:
      name: "Google: username = email"
    attrs:
      expression: |
        return {"username": info.get("email")}

  # Own flows for Google sign-in (same stages as Authentik's defaults, which
  # say "Welcome to authentik!" and would be reset if changed).
  - model: authentik_flows.flow
    id: flow-google-sign-in
    conditions:
      - !Context google_client_id
    identifiers:
      slug: headscale-easy-google-sign-in
    attrs:
      name: "Headscale Easy: sign in with Google"
      title: Sign in
      designation: authentication
      authentication: require_unauthenticated
  - model: authentik_flows.flowstagebinding
    conditions:
      - !Context google_client_id
    identifiers:
      target: !KeyOf flow-google-sign-in
      stage: !Find [authentik_stages_user_login.userloginstage, [name, default-source-authentication-login]]
      order: 0
  - model: authentik_policies.policybinding
    conditions:
      - !Context google_client_id
    identifiers:
      target: !KeyOf flow-google-sign-in
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, default-source-authentication-if-sso]]
      order: 0

  - model: authentik_flows.flow
    id: flow-google-enrollment
    conditions:
      - !Context google_client_id
    identifiers:
      slug: headscale-easy-google-enrollment
    attrs:
      name: "Headscale Easy: first Google sign-in"
      title: Choose a user name
      designation: enrollment
      authentication: none
  # Asks for a user name only if the one from Google (the email) is taken
  - model: authentik_flows.flowstagebinding
    id: google-enrollment-prompt-binding
    conditions:
      - !Context google_client_id
    identifiers:
      target: !KeyOf flow-google-enrollment
      stage: !Find [authentik_stages_prompt.promptstage, [name, default-source-enrollment-prompt]]
      order: 0
    attrs:
      re_evaluate_policies: true
  - model: authentik_flows.flowstagebinding
    conditions:
      - !Context google_client_id
    identifiers:
      target: !KeyOf flow-google-enrollment
      stage: !Find [authentik_stages_user_write.userwritestage, [name, default-source-enrollment-write]]
      order: 1
  - model: authentik_flows.flowstagebinding
    conditions:
      - !Context google_client_id
    identifiers:
      target: !KeyOf flow-google-enrollment
      stage: !Find [authentik_stages_user_login.userloginstage, [name, default-source-enrollment-login]]
      order: 2
  - model: authentik_policies.policybinding
    conditions:
      - !Context google_client_id
    identifiers:
      target: !KeyOf flow-google-enrollment
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, default-source-enrollment-if-sso]]
      order: 0
  - model: authentik_policies.policybinding
    conditions:
      - !Context google_client_id
    identifiers:
      target: !KeyOf google-enrollment-prompt-binding
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, default-source-enrollment-if-username]]
      order: 0

  - model: authentik_sources_oauth.oauthsource
    id: google-source
    conditions:
      - !Context google_client_id
    identifiers:
      slug: google
    attrs:
      name: Google
      enabled: true
      provider_type: google
      consumer_key: !Context google_client_id
      consumer_secret: !Env [GOOGLE_CLIENT_SECRET, ""]
      authentication_flow: !KeyOf flow-google-sign-in
      enrollment_flow: !KeyOf flow-google-enrollment
      # A Google account with the same email as a local user signs in as that
      # user. Google verifies emails, so this is safe as long as local users'
      # emails are real.
      user_matching_mode: email_link
      user_property_mappings:
        - !KeyOf google-username

  # "Google" button on the sign-in page
  - model: authentik_stages_identification.identificationstage
    conditions:
      - !Context google_client_id
    identifiers:
      name: headscale-easy-identification
    attrs:
      sources:
        - !KeyOf google-source

  # ---------------------------------------------------------------------------
  # "Headscale Easy" theme (Tailscale look, dark and light)
  # ---------------------------------------------------------------------------
  # Files live in authentik/branding/. Logo, favicon and background are served
  # by Authentik from media/public/branding (mounted on the server); the CSS
  # is embedded here with !File (mounted on the worker, which applies this).
  - model: authentik_brands.brand
    identifiers:
      domain: authentik-default
    attrs:
      branding_title: Headscale Easy
      # %(theme)s -> logo-light.svg / logo-dark.svg for the active theme
      branding_logo: branding/logo-%(theme)s.svg
      branding_favicon: branding/favicon.svg
      branding_default_flow_background: branding/background.svg
      branding_custom_css: !File [/branding/custom.css, ""]
      flow_authentication: !KeyOf flow-sign-in
      flow_invalidation: !KeyOf flow-sign-out
      # Dark or light following the browser; each user can pin it in their
      # Authentik settings. The CSS defines both variants.
      attributes:
        settings:
          theme:
            base: automatic

  # ---------------------------------------------------------------------------
  # Add-user form for admins
  # ---------------------------------------------------------------------------
  # At <public_url>/add-user (redirects to this flow) so members of vpn-admins
  # can create accounts without the Authentik admin interface. It asks for
  # name, user name, email, password and access (tailnet only, or tailnet +
  # admin) and puts the user in the matching group.
  - model: authentik_policies_password.passwordpolicy
    id: add-user-password-policy
    identifiers:
      name: "Headscale Easy: add-user password"
    attrs:
      password_field: password
      length_min: 10
      amount_digits: 0
      amount_uppercase: 0
      amount_lowercase: 0
      amount_symbols: 0
      check_static_rules: true
      check_have_i_been_pwned: false
      check_zxcvbn: false
      error_message: The password must be at least 10 characters long.

  - model: authentik_stages_prompt.prompt
    id: add-user-name
    identifiers:
      name: headscale-easy-add-user-name
    attrs:
      field_key: name
      label: Full name
      type: text
      required: true
      placeholder: Ada Lovelace
      order: 0
  - model: authentik_stages_prompt.prompt
    id: add-user-username
    identifiers:
      name: headscale-easy-add-user-username
    attrs:
      field_key: username
      label: User name
      # 'username' also checks it is not taken
      type: username
      required: true
      placeholder: ada
      sub_text: Used to sign in; also their user name in Headscale.
      order: 1
  - model: authentik_stages_prompt.prompt
    id: add-user-email
    identifiers:
      name: headscale-easy-add-user-email
    attrs:
      field_key: email
      label: Email
      type: email
      required: true
      placeholder: ada@example.com
      sub_text: Can also be used to sign in.
      order: 2
  - model: authentik_stages_prompt.prompt
    id: add-user-password
    identifiers:
      name: headscale-easy-add-user-password
    attrs:
      field_key: password
      label: Password
      type: password
      required: true
      placeholder: At least 10 characters
      order: 3
  # Two password fields: Authentik checks on its own that they match
  - model: authentik_stages_prompt.prompt
    id: add-user-password-repeat
    identifiers:
      name: headscale-easy-add-user-password-repeat
    attrs:
      field_key: password_repeat
      label: Repeat password
      type: password
      required: true
      placeholder: Repeat password
      order: 4
  - model: authentik_stages_prompt.prompt
    id: add-user-role
    identifiers:
      name: headscale-easy-add-user-role
    attrs:
      # 'rol' is not a user field: user_write discards it; only the
      # add-user-group policy reads it to pick the group.
      field_key: rol
      label: Access
      type: radio-button-group
      required: true
      placeholder_expression: true
      placeholder: |
        return [
            {"label": "Member: can connect their own devices", "value": "headscale-users"},
            {"label": "Admin: manages the whole tailnet", "value": "vpn-admins"},
        ]
      initial_value: headscale-users
      order: 5

  # One account per email and per user name: rejects duplicates (also against
  # accounts created by signing in with Google).
  - model: authentik_policies_expression.expressionpolicy
    id: add-user-unique
    identifiers:
      name: "Headscale Easy: add-user unique email and user name"
    attrs:
      expression: |
        from authentik.core.models import User
        data = request.context.get("prompt_data", {})
        email = (data.get("email") or "").strip()
        username = (data.get("username") or "").strip()
        ok = True
        if email and User.objects.filter(email__iexact=email).exists():
            ak_message("A user with this email already exists.")
            ok = False
        if username and User.objects.filter(username__iexact=username).exists():
            ak_message("This user name is already taken.")
            ok = False
        return ok

  - model: authentik_stages_prompt.promptstage
    id: add-user-prompt
    identifiers:
      name: headscale-easy-add-user-prompt
    attrs:
      fields:
        - !KeyOf add-user-name
        - !KeyOf add-user-username
        - !KeyOf add-user-email
        - !KeyOf add-user-password
        - !KeyOf add-user-password-repeat
        - !KeyOf add-user-role
      validation_policies:
        - !KeyOf add-user-password-policy
        - !KeyOf add-user-unique

  # ALWAYS creates a new user: the admin filling in the form is signed in and,
  # without always_create, the data would be written over their own account.
  - model: authentik_stages_user_write.userwritestage
    id: add-user-write
    identifiers:
      name: headscale-easy-add-user-write
    attrs:
      user_creation_mode: always_create
      create_users_as_inactive: false
      user_type: internal

  # Final screen: confirms; "Continue" goes to Users in the web UI
  - model: authentik_stages_prompt.prompt
    id: add-user-done-field
    identifiers:
      name: headscale-easy-add-user-done
    attrs:
      field_key: done
      label: User created
      type: alert_info
      required: false
      initial_value_expression: true
      initial_value: |
        return f"User «{prompt_context.get('username', '')}» created. They can now sign in to Headscale Easy and connect their devices. To add someone else, open /add-user again."
      order: 0
  - model: authentik_stages_prompt.promptstage
    id: add-user-done
    identifiers:
      name: headscale-easy-add-user-done
    attrs:
      fields:
        - !KeyOf add-user-done-field
  - model: authentik_stages_redirect.redirectstage
    id: add-user-back
    identifiers:
      name: headscale-easy-add-user-back
    attrs:
      mode: static
      target_static: !Format ["%s/admin/users", !Context public_url]
      keep_context: false

  - model: authentik_flows.flow
    id: flow-add-user
    identifiers:
      slug: headscale-easy-add-user
    attrs:
      name: "Headscale Easy: add user"
      title: Add user
      designation: enrollment
      # Signed-in users only; which ones is decided by the bindings
      authentication: require_authenticated
      denied_action: message
      policy_engine_mode: any
      layout: stacked

  # Who may use the form
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf flow-add-user
      order: 0
    attrs:
      group: !KeyOf group-admins
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf flow-add-user
      order: 1
    attrs:
      group: !Find [authentik_core.group, [name, "authentik Admins"]]

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-add-user
      order: 10
    attrs:
      stage: !KeyOf add-user-prompt
  - model: authentik_flows.flowstagebinding
    id: add-user-write-binding
    identifiers:
      target: !KeyOf flow-add-user
      order: 20
    attrs:
      stage: !KeyOf add-user-write
      # The group policy needs the form data, which does not exist at planning
      # time: it is evaluated right before this stage.
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-add-user
      order: 30
    attrs:
      stage: !KeyOf add-user-done
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-add-user
      order: 40
    attrs:
      stage: !KeyOf add-user-back

  # Turns the chosen access into a group. user_write adds the user to the
  # groups found in the flow context under "groups".
  - model: authentik_policies_expression.expressionpolicy
    id: add-user-group
    identifiers:
      name: headscale-easy-add-user-group
    attrs:
      expression: |
        from authentik.core.models import Group

        rol = request.context.get("prompt_data", {}).get("rol")
        if rol not in ("headscale-users", "vpn-admins"):
            ak_message("Invalid access")
            return False
        request.context["flow_plan"].context["groups"] = [Group.objects.get(name=rol)]
        return True
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf add-user-write-binding
      order: 0
    attrs:
      policy: !KeyOf add-user-group

  # Shortcut in the Authentik app library, visible only to who may use it
  - model: authentik_core.application
    id: app-add-user
    identifiers:
      slug: headscale-easy-add-user
    attrs:
      name: Add user
      meta_launch_url: !Format ["%s/add-user", !Context public_url]
      meta_description: "Create accounts for the tailnet"
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-add-user
      order: 0
    attrs:
      group: !KeyOf group-admins
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-add-user
      order: 1
    attrs:
      group: !Find [authentik_core.group, [name, "authentik Admins"]]

  # ---------------------------------------------------------------------------
  # Invitations and password reset
  # ---------------------------------------------------------------------------
  # Admins create both from the web UI (Users), which calls Authentik's API
  # with the service account's token:
  #   - an invitation is a single-use link to the flow below, where the person
  #     chooses their user name and password; the access (member or admin) and,
  #     optionally, the email are fixed by the admin in the invitation;
  #   - a password reset link (Authentik's "recovery link") opens the recovery
  #     flow for one account, where its owner sets a new password.
  # With outgoing email (SMTP_HOST in .env), the sign-in page also shows
  # "Forgot password?", which emails a reset link to the account's address.

  # What the web UI's service account may do besides the two-factor policy:
  # list accounts (to match them with Headscale users), create reset links,
  # and create, list and delete invitations. Global permissions live in a
  # role, which a group gives to the account. Authentik checks "add user" on
  # the account a reset link is made for (the link is a POST on that user),
  # so the role has it too: it allows no more than the add-user form already
  # does for tailnet admins (never adding anyone to a superuser group).
  - model: authentik_rbac.role
    id: web-role
    identifiers:
      name: "Headscale Easy web UI"
    attrs:
      permissions:
        - authentik_core.view_user
        - authentik_core.add_user
        - authentik_core.reset_user_password
        - authentik_stages_invitation.add_invitation
        - authentik_stages_invitation.view_invitation
        - authentik_stages_invitation.delete_invitation
  - model: authentik_core.group
    id: web-group
    identifiers:
      name: "Headscale Easy web UI (service account)"
    attrs:
      roles:
        - !KeyOf web-role
  - model: authentik_core.user
    identifiers:
      username: headscale-easy-web
    attrs:
      groups:
        - !KeyOf web-group

  # --- The invitation flow: "Create your account" ---------------------------
  - model: authentik_stages_invitation.invitationstage
    id: invitation-stage
    identifiers:
      name: headscale-easy-invitation
    attrs:
      # Without a valid invitation the flow stops here
      continue_flow_without_invitation: false

  # The email is locked when the invitation fixes it (read-only field)
  - model: authentik_stages_prompt.prompt
    id: invitation-email-fixed
    identifiers:
      name: headscale-easy-invitation-email-fixed
    attrs:
      field_key: email
      label: Email
      type: text_read_only
      required: true
      sub_text: Set by your invitation. Can also be used to sign in.
      order: 2
  - model: authentik_stages_prompt.promptstage
    id: invitation-prompt
    identifiers:
      name: headscale-easy-invitation-prompt
    attrs:
      fields:
        - !KeyOf add-user-name
        - !KeyOf add-user-username
        - !KeyOf add-user-email
        - !KeyOf add-user-password
        - !KeyOf add-user-password-repeat
      validation_policies:
        - !KeyOf add-user-password-policy
        - !KeyOf add-user-unique
  - model: authentik_stages_prompt.promptstage
    id: invitation-prompt-fixed
    identifiers:
      name: headscale-easy-invitation-prompt-fixed-email
    attrs:
      fields:
        - !KeyOf add-user-name
        - !KeyOf add-user-username
        - !KeyOf invitation-email-fixed
        - !KeyOf add-user-password
        - !KeyOf add-user-password-repeat
      validation_policies:
        - !KeyOf add-user-password-policy
        - !KeyOf add-user-unique

  # Does the invitation in use fix the email? Picks one of the two forms.
  - model: authentik_policies_expression.expressionpolicy
    id: invitation-has-email
    identifiers:
      name: "Headscale Easy: invitation fixes the email"
    attrs:
      expression: |
        invitation = request.context.get("invitation")
        return bool(invitation and (invitation.fixed_data or {}).get("email"))

  # The group comes from the invitation itself (set by the admin in the web
  # UI), never from anything the invited person can send. The invitation is
  # used up here, right before the account is created, not when the link is
  # opened: a person who opens it and leaves can still come back. If two
  # people fill in the same link, only the first one gets an account.
  - model: authentik_policies_expression.expressionpolicy
    id: invitation-group
    identifiers:
      name: "Headscale Easy: invitation group"
    attrs:
      expression: |
        from authentik.core.models import Group
        from authentik.stages.invitation.models import Invitation

        invitation = request.context.get("invitation")
        group = (invitation.fixed_data or {}).get("hse_group") if invitation else None
        if group not in ("headscale-users", "vpn-admins"):
            ak_message("This invitation is not valid.")
            return False
        # Deleted (used) now; 0 = already used, revoked or expired meanwhile
        deleted, _ = Invitation.objects.filter(pk=invitation.pk).delete()
        if not deleted:
            ak_message("This invitation has already been used, was revoked or has expired.")
            return False
        request.context["flow_plan"].context["groups"] = [Group.objects.get(name=group)]
        return True

  - model: authentik_stages_user_write.userwritestage
    id: invitation-write
    identifiers:
      name: headscale-easy-invitation-write
    attrs:
      user_creation_mode: always_create
      create_users_as_inactive: false
      user_type: internal
  - model: authentik_stages_user_login.userloginstage
    id: invitation-login
    identifiers:
      name: headscale-easy-invitation-login
  # Straight into the web UI (already signed in)
  - model: authentik_stages_redirect.redirectstage
    id: to-web-ui
    identifiers:
      name: headscale-easy-to-web-ui
    attrs:
      mode: static
      target_static: !Format ["%s/admin/", !Context public_url]
      keep_context: false

  - model: authentik_flows.flow
    id: flow-invitation
    identifiers:
      slug: headscale-easy-invitation
    permissions:
      # The web UI needs the flow's id to create invitations for it
      - permission: authentik_flows.view_flow
        user: !KeyOf web-service-account
    attrs:
      name: "Headscale Easy: invitation"
      title: Create your account
      designation: enrollment
      authentication: none
      denied_action: message
      layout: stacked
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-invitation
      order: 10
    attrs:
      stage: !KeyOf invitation-stage
  # The two forms: decided when the stage is reached (the invitation is not
  # known when the flow starts)
  - model: authentik_flows.flowstagebinding
    id: invitation-prompt-binding
    identifiers:
      target: !KeyOf flow-invitation
      order: 20
    attrs:
      stage: !KeyOf invitation-prompt
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf invitation-prompt-binding
      order: 0
    attrs:
      policy: !KeyOf invitation-has-email
      negate: true
  - model: authentik_flows.flowstagebinding
    id: invitation-prompt-fixed-binding
    identifiers:
      target: !KeyOf flow-invitation
      order: 21
    attrs:
      stage: !KeyOf invitation-prompt-fixed
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf invitation-prompt-fixed-binding
      order: 0
    attrs:
      policy: !KeyOf invitation-has-email
  - model: authentik_flows.flowstagebinding
    id: invitation-write-binding
    identifiers:
      target: !KeyOf flow-invitation
      order: 30
    attrs:
      stage: !KeyOf invitation-write
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf invitation-write-binding
      order: 0
    attrs:
      policy: !KeyOf invitation-group
  # When the invitation was used up meanwhile, no account was created: say so
  # and stop
  - model: authentik_stages_deny.denystage
    id: invitation-used
    identifiers:
      name: headscale-easy-invitation-used
    attrs:
      deny_message: This invitation has already been used, was revoked or has expired. Ask an admin for a new one.
  - model: authentik_policies_expression.expressionpolicy
    id: invitation-not-applied
    identifiers:
      name: "Headscale Easy: invitation not applied"
    attrs:
      expression: |
        return not request.context["flow_plan"].context.get("groups")
  - model: authentik_flows.flowstagebinding
    id: invitation-used-binding
    identifiers:
      target: !KeyOf flow-invitation
      order: 35
    attrs:
      stage: !KeyOf invitation-used
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf invitation-used-binding
      order: 0
    attrs:
      policy: !KeyOf invitation-not-applied
  # Same two-factor rule as the sign-in: a new admin (with the default mode)
  # sets up their second factor before getting in
  - model: authentik_flows.flowstagebinding
    id: invitation-mfa-binding
    identifiers:
      target: !KeyOf flow-invitation
      order: 40
    attrs:
      stage: !KeyOf mfa-required-stage
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf invitation-mfa-binding
      order: 0
    attrs:
      policy: !KeyOf mfa-required-policy
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-invitation
      order: 50
    attrs:
      stage: !KeyOf invitation-login
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-invitation
      order: 60
    attrs:
      stage: !KeyOf to-web-ui

  # --- Password reset: "Choose a new password" --------------------------------
  - model: authentik_stages_prompt.prompt
    id: recovery-password
    identifiers:
      name: headscale-easy-recovery-password
    attrs:
      field_key: password
      label: New password
      type: password
      required: true
      placeholder: At least 10 characters
      order: 0
  - model: authentik_stages_prompt.prompt
    id: recovery-password-repeat
    identifiers:
      name: headscale-easy-recovery-password-repeat
    attrs:
      field_key: password_repeat
      label: Repeat password
      type: password
      required: true
      placeholder: Repeat password
      order: 1
  - model: authentik_stages_prompt.promptstage
    id: recovery-prompt
    identifiers:
      name: headscale-easy-recovery-prompt
    attrs:
      fields:
        - !KeyOf recovery-password
        - !KeyOf recovery-password-repeat
      validation_policies:
        - !KeyOf add-user-password-policy
  - model: authentik_stages_user_write.userwritestage
    id: recovery-write
    identifiers:
      name: headscale-easy-recovery-write
    attrs:
      user_creation_mode: never_create
  - model: authentik_stages_prompt.prompt
    id: recovery-done-field
    identifiers:
      name: headscale-easy-recovery-done
    attrs:
      field_key: done
      label: Password changed
      type: alert_info
      required: false
      initial_value: Your password has been changed. Continue to sign in with it.
      order: 0
  - model: authentik_stages_prompt.promptstage
    id: recovery-done
    identifiers:
      name: headscale-easy-recovery-done
    attrs:
      fields:
        - !KeyOf recovery-done-field

  # Reset links are made for one account by the web UI (the flow is planned
  # with that account): opening the flow without a link is refused. Nor can
  # links be made for Authentik's superusers (akadmin and "authentik Admins"):
  # otherwise a tailnet admin could take over Authentik itself.
  - model: authentik_policies_expression.expressionpolicy
    id: recovery-allowed
    identifiers:
      name: "Headscale Easy: password reset link allowed"
    attrs:
      expression: |
        user = request.context.get("pending_user")
        if not getattr(user, "pk", None):
            ak_message("This link is invalid or has expired. Ask an admin for a new one.")
            return False
        if user.is_superuser or ak_is_group_member(user, name="authentik Admins"):
            ak_message("Authentik administrators reset their password in Authentik.")
            return False
        return True

  - model: authentik_flows.flow
    id: flow-recovery
    identifiers:
      slug: headscale-easy-recovery
    attrs:
      name: "Headscale Easy: password reset"
      title: Choose a new password
      designation: recovery
      authentication: none
      denied_action: message
      layout: stacked
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf flow-recovery
      order: 0
    attrs:
      policy: !KeyOf recovery-allowed
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-recovery
      order: 10
    attrs:
      stage: !KeyOf recovery-prompt
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-recovery
      order: 20
    attrs:
      stage: !KeyOf recovery-write
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-recovery
      order: 30
    attrs:
      stage: !KeyOf recovery-done
  # To the web UI, which asks to sign in with the new password (and the
  # second factor, when it applies)
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf flow-recovery
      order: 40
    attrs:
      stage: !KeyOf to-web-ui

  # Authentik's API makes reset links for the brand's recovery flow
  - model: authentik_brands.brand
    identifiers:
      domain: authentik-default
    attrs:
      flow_recovery: !KeyOf flow-recovery

  # --- "Forgot password?" by email (only with SMTP_HOST) ------------------------
  # Asks for the user name or email and sends a link to the account's email
  # (Authentik's email settings: AUTHENTIK_EMAIL__* from SMTP_* in .env).
  # Following the link continues this same flow with the new password form.
  - model: authentik_stages_identification.identificationstage
    id: forgot-identification
    conditions:
      - !Context smtp_host
    identifiers:
      name: headscale-easy-forgot-identification
    attrs:
      user_fields:
        - email
        - username
      # Same answer whether the account exists or not
      pretend_user_exists: true
      show_matched_user: false
  - model: authentik_stages_email.emailstage
    id: forgot-email
    conditions:
      - !Context smtp_host
    identifiers:
      name: headscale-easy-forgot-email
    attrs:
      use_global_settings: true
      template: email/password_reset.html
      subject: Reset your password
      token_expiry: minutes=30
      activate_user_on_success: false
  - model: authentik_flows.flow
    id: flow-forgot
    conditions:
      - !Context smtp_host
    identifiers:
      slug: headscale-easy-forgot-password
    attrs:
      name: "Headscale Easy: forgot password"
      title: Reset your password
      designation: recovery
      authentication: require_unauthenticated
      denied_action: message
      layout: stacked
  - model: authentik_flows.flowstagebinding
    conditions:
      - !Context smtp_host
    identifiers:
      target: !KeyOf flow-forgot
      order: 10
    attrs:
      stage: !KeyOf forgot-identification
  # The email stage only lets the flow go on from the emailed link
  - model: authentik_flows.flowstagebinding
    conditions:
      - !Context smtp_host
    identifiers:
      target: !KeyOf flow-forgot
      order: 20
    attrs:
      stage: !KeyOf forgot-email
  - model: authentik_flows.flowstagebinding
    conditions:
      - !Context smtp_host
    identifiers:
      target: !KeyOf flow-forgot
      order: 30
    attrs:
      stage: !KeyOf recovery-prompt
  - model: authentik_flows.flowstagebinding
    conditions:
      - !Context smtp_host
    identifiers:
      target: !KeyOf flow-forgot
      order: 40
    attrs:
      stage: !KeyOf recovery-write
  - model: authentik_flows.flowstagebinding
    conditions:
      - !Context smtp_host
    identifiers:
      target: !KeyOf flow-forgot
      order: 50
    attrs:
      stage: !KeyOf recovery-done
  - model: authentik_flows.flowstagebinding
    conditions:
      - !Context smtp_host
    identifiers:
      target: !KeyOf flow-forgot
      order: 60
    attrs:
      stage: !KeyOf to-web-ui

  # "Forgot password?" under the sign-in form: only with email (without it,
  # an admin makes a reset link from the web UI)
  - model: authentik_stages_identification.identificationstage
    identifiers:
      name: headscale-easy-identification
    attrs:
      user_fields:
        - email
        - username
      recovery_flow: !If [!Context smtp_host, !KeyOf flow-forgot, null]
