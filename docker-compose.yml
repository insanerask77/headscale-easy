# =============================================================================
# Headscale Easy — https://github.com/insanerask77/headscale-easy
# by Rafa Madolell (@insanerask77) · MIT License
# =============================================================================
# Settings live in .env (written by install.sh). To reconfigure, run
# ./install.sh again, or edit .env and run: docker compose up -d

networks:
  headscale-net:
    driver: bridge
    name: ${NETWORK_NAME:-headscale-net}

volumes:
  headscale-data:
    name: headscale-data
  headscale-socket:
    name: headscale-socket
  caddy-data:
    name: caddy-data
  caddy-config:
    name: caddy-config
  # hs-helper's Unix socket, shared with the web UI
  hse-helper:
    name: hse-helper
  # Only used with AUTH_PROVIDER=authentik
  authentik-db:
    name: authentik-db
  authentik-data:
    name: authentik-data
  # The image links /data/media -> /media, so uploads from Authentik's UI
  # (icons, logos) live in /media and need their own volume.
  authentik-media:
    name: authentik-media

# Environment shared by Authentik's server and worker. Empty defaults (not
# ':?') on purpose: Compose interpolates the whole file even when the
# 'authentik' profile is inactive, and ':?' would break the stack for
# everyone not using Authentik.
x-authentik-env: &authentik-env
  AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-}
  AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
  AUTHENTIK_POSTGRESQL__NAME: authentik
  AUTHENTIK_POSTGRESQL__USER: authentik
  AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_PG_PASS:-}
  # Authentik lives under /authentik/ on the same domain: the root belongs to
  # Headscale, which already uses /auth/{id} to register nodes.
  AUTHENTIK_WEB__PATH: /authentik/
  AUTHENTIK_WEB__BASE_URL: ${HEADSCALE_PUBLIC_URL:-}
  AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
  # The 'akadmin' user: only read on the first start
  AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_ADMIN_EMAIL:-}
  AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-}
  # Used by authentik/blueprints/headscale.yaml
  HEADSCALE_PUBLIC_URL: ${HEADSCALE_PUBLIC_URL:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  PORTAL_OIDC_CLIENT_ID: ${PORTAL_OIDC_CLIENT_ID:-headscale-easy}
  PORTAL_OIDC_CLIENT_SECRET: ${PORTAL_OIDC_CLIENT_SECRET:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  # Two-factor authentication: admins (required for admins), everyone,
  # optional. Only the initial value: admins change it from the web UI.
  MFA_REQUIRED: ${MFA_REQUIRED:-admins}
  # API token of the web UI's service account (two-factor mode, invitations,
  # password reset links)
  PORTAL_AUTHENTIK_TOKEN: ${PORTAL_AUTHENTIK_TOKEN:-}
  # Outgoing email (optional, SMTP_HOST empty = off): "Forgot password?" on
  # the sign-in page. SMTP_HOST also tells the blueprint to enable it.
  SMTP_HOST: ${SMTP_HOST:-}
  AUTHENTIK_EMAIL__HOST: ${SMTP_HOST:-localhost}
  AUTHENTIK_EMAIL__PORT: ${SMTP_PORT:-587}
  AUTHENTIK_EMAIL__USERNAME: ${SMTP_USERNAME:-}
  AUTHENTIK_EMAIL__PASSWORD: ${SMTP_PASSWORD:-}
  AUTHENTIK_EMAIL__USE_TLS: ${SMTP_USE_TLS:-false}
  AUTHENTIK_EMAIL__USE_SSL: ${SMTP_USE_SSL:-false}
  AUTHENTIK_EMAIL__FROM: ${SMTP_FROM:-authentik@localhost}
  AUTHENTIK_EMAIL__TIMEOUT: "15"
  TZ: ${TZ:-UTC}

services:
  # ---------------------------------------------------------------------------
  # HEADSCALE - control plane
  # ---------------------------------------------------------------------------
  headscale:
    image: headscale/headscale:${HEADSCALE_IMAGE_TAG:-latest}
    container_name: headscale
    restart: unless-stopped

    volumes:
      # Configuration
      - ./headscale-config.yaml:/etc/headscale/config.yaml:ro
      - ./headscale-derp.yaml:/etc/headscale/derp.yaml:ro

      # Persistent data
      - headscale-data:/var/lib/headscale

      # CLI Unix socket (docker exec headscale headscale ...)
      - headscale-socket:/var/run/headscale

    networks:
      - headscale-net

    ports:
      # DERP/STUN (UDP) - MUST be reachable for clients to connect. It is
      # plain UDP: no HTTP reverse proxy can carry it.
      - "${HEADSCALE_DERP_PORT:-3478}:3478/udp"

      # The HTTP API (8080) and metrics (9090) are NOT published: only Caddy
      # reaches them over Docker's internal network.

    environment:
      - TZ=${TZ:-UTC}

    command: serve

    healthcheck:
      test: ["CMD", "headscale", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - NET_ADMIN

    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # CADDY - reverse proxy and (optionally) TLS
  # ---------------------------------------------------------------------------
  # ALWAYS runs: it routes the stack's single domain
  #   /          -> Headscale
  #   /admin     -> Headscale Easy web UI
  #   /authentik -> Authentik (only with AUTH_PROVIDER=authentik)
  # Whether it also terminates TLS depends on SSL_MODE in .env; with 'front'
  # or 'none' it only proxies over HTTP.
  caddy:
    image: caddy:${CADDY_IMAGE_TAG:-2-alpine}
    container_name: caddy
    restart: unless-stopped

    # service_started is enough: Caddy resolves upstreams per request, not at
    # startup.
    depends_on:
      headscale:
        condition: service_started

    volumes:
      # Caddyfile
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

      # Persistent data (certificates)
      - caddy-data:/data

      # Persistent configuration
      - caddy-config:/config

      # Logs
      - ./data/caddy-logs:/var/log/caddy

    networks:
      - headscale-net

    # Ports are published by docker-compose.override.yml, generated by
    # install.sh: with SSL_MODE=none Caddy only listens on HTTP and publishing
    # 443 would take the port for nothing. Compose merges 'ports' lists by
    # adding, never removing, so they cannot be declared here.
    # ports:
    #   - "${HTTP_PORT:-80}:80"
    #   - "${HTTPS_PORT:-443}:443"
    #   - "${HTTPS_PORT:-443}:443/udp"

    environment:
      - TZ=${TZ:-UTC}
      - ACME_EMAIL=${ACME_EMAIL:-}

    healthcheck:
      # Explicit 127.0.0.1: Caddy's admin API only listens on IPv4 and
      # BusyBox wget resolves "localhost" to ::1 first -> connection refused.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # AUTHENTIK - identity provider (optional, 'authentik' profile)
  # ---------------------------------------------------------------------------
  # Gives Headscale and the web UI username/password sign-in and, optionally,
  # Google. Only starts when .env has COMPOSE_PROFILES=authentik, which is
  # what install.sh writes for AUTH_PROVIDER=authentik.
  #
  # Publishes no ports: Caddy serves it under /authentik/ on the same domain.
  # Its configuration (OIDC providers, groups, Google, theme) is applied by
  # the blueprint authentik/blueprints/headscale.yaml.
  authentik-postgresql:
    image: docker.io/library/postgres:${AUTHENTIK_PG_IMAGE_TAG:-16-alpine}
    container_name: authentik-postgresql
    profiles: ["authentik"]
    restart: unless-stopped

    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_PG_PASS:-}

    volumes:
      - authentik-db:/var/lib/postgresql/data

    networks:
      - headscale-net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d authentik -U authentik"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    security_opt:
      - no-new-privileges:true

  authentik-server:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_IMAGE_TAG:-2026.8.3}
    container_name: authentik-server
    profiles: ["authentik"]
    restart: unless-stopped
    command: server

    depends_on:
      authentik-postgresql:
        condition: service_healthy

    environment: *authentik-env

    volumes:
      - authentik-data:/data
      - authentik-media:/media
      - ./authentik/blueprints:/blueprints/custom:ro
      # Logo, favicon and background: the brand references them as
      # "branding/<file>", which Authentik serves from media/public/
      - ./authentik/branding:/media/public/branding:ro

    networks:
      - headscale-net

    shm_size: 512mb

    # The healthcheck ('ak healthcheck') is defined by the image

    security_opt:
      - no-new-privileges:true

  authentik-worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_IMAGE_TAG:-2026.8.3}
    container_name: authentik-worker
    profiles: ["authentik"]
    restart: unless-stopped
    command: worker

    depends_on:
      authentik-postgresql:
        condition: service_healthy

    environment: *authentik-env

    # Unlike the official compose file, no Docker socket and no 'user: root':
    # those are only needed for Authentik to manage outpost containers, which
    # are not used here.
    volumes:
      - authentik-data:/data
      - authentik-media:/media
      - ./authentik/blueprints:/blueprints/custom:ro
      # The blueprint reads the theme CSS from here (!File /branding/custom.css)
      - ./authentik/branding:/branding:ro

    networks:
      - headscale-net

    shm_size: 512mb

    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # BACKUP - scheduled backups (see backup/backup.sh)
  # ---------------------------------------------------------------------------
  # Optional ('backup' profile, enabled by the installer when you choose daily
  # backups). Every day at BACKUP_SCHEDULE: Headscale's database (consistent
  # online copy) and private keys, Authentik's database, the configuration and
  # Caddy's internal CA, as one .tar.gz in BACKUP_DIR. Keeps BACKUP_KEEP_DAYS
  # days. 'make backup' works without the profile too (one-off copy).
  # Restore with: make restore file=... (scripts/restore.sh).
  backup:
    build: ./backup
    image: headscale-easy-backup:local
    container_name: headscale-easy-backup
    profiles: ["backup"]
    restart: unless-stopped

    environment:
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 3 * * *}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_UID: ${PORTAL_UID:-1000}
      BACKUP_GID: ${PORTAL_GID:-1000}
      PGHOST: authentik-postgresql
      PGUSER: authentik
      PGDATABASE: authentik
      PGPASSWORD: ${AUTHENTIK_PG_PASS:-}
      TZ: ${TZ:-UTC}
      # Optional remote copy: an rclone remote (s3:bucket/dir) or rsync:user@host:/dir
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      BACKUP_REMOTE_KEEP_DAYS: ${BACKUP_REMOTE_KEEP_DAYS:-${BACKUP_KEEP_DAYS:-14}}
      BACKUP_REMOTE_SSH_PORT: ${BACKUP_REMOTE_SSH_PORT:-22}
      AWS_ACCESS_KEY_ID: ${BACKUP_AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_AWS_SECRET_ACCESS_KEY:-}

    volumes:
      # rclone.conf, id_ed25519 and known_hosts for the remote copy
      - ${BACKUP_REMOTE_CONFIG:-./data/backup-remote}:/remote-config:ro
      # Read-only: what gets backed up
      - headscale-data:/headscale:ro
      - caddy-data:/caddy:ro
      - ./:/project:ro
      # Where backups go (a NAS mount, for instance)
      - ${BACKUP_DIR:-./backups}:/backups

    networks:
      - headscale-net

    # Root inside the container: Headscale's private keys are readable by
    # root only. Archives are handed to PORTAL_UID. Only the capabilities to
    # read files, change their owner and let crond start its job.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # HS-HELPER - the only container with the Docker socket
  # ---------------------------------------------------------------------------
  # Docker socket access is equivalent to root on the host, so the web UI does
  # not get it. This helper does, and answers exactly three fixed requests on
  # a Unix socket in the hse-helper volume: validate Headscale's config
  # ('headscale configtest'), restart Headscale, and report the stack's
  # container health and Headscale's version. No parameters, no other
  # container, no other command (see helper/helper.py). It has no network.
  hs-helper:
    image: ghcr.io/insanerask77/headscale-easy-helper:${HSE_VERSION:-latest}
    build: ./helper
    container_name: headscale-easy-helper
    restart: unless-stopped

    network_mode: none

    environment:
      HEADSCALE_CONTAINER: headscale
      TZ: ${TZ:-UTC}

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - hse-helper:/run/hse-helper

    # Same uid/gid as the web UI (so it can use the 660 socket) plus the
    # Docker socket's group; never as root.
    user: "${PORTAL_UID:-1000}:${PORTAL_GID:-1000}"
    group_add:
      - "${DOCKER_GID:-999}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # HEADSCALE EASY - Web UI
  # ---------------------------------------------------------------------------
  # Members see and manage their own machines; admins manage everything
  # (machines, users, routes, tags, ACL policy, DNS, API keys). Served by Caddy
  # at /admin. Sign-in with OIDC (Authentik or your own provider) and/or a
  # Headscale API key, depending on AUTH_PROVIDER (set by install.sh).
  #
  # Uses the published image; if it is not available it is built from ./web.
  web:
    image: ghcr.io/insanerask77/headscale-easy:${HSE_VERSION:-latest}
    build: ./web
    container_name: headscale-easy
    restart: unless-stopped

    depends_on:
      headscale:
        condition: service_healthy
      hs-helper:
        condition: service_started

    environment:
      PUBLIC_URL: ${HEADSCALE_PUBLIC_URL:-}
      TAILNET_NAME: ${TAILNET_NAME:-}
      DEFAULT_LANG: ${UI_LANG:-en}
      # Rename Apple devices that register as "localhost" to <owner>-<device>
      AUTO_RENAME_LOCALHOST: ${AUTO_RENAME_LOCALHOST:-true}
      RENAME_INTERVAL: ${RENAME_INTERVAL:-5}
      # Machines page: "Expires soon" window and "inactive" threshold (days)
      EXPIRY_WARNING_DAYS: ${EXPIRY_WARNING_DAYS:-14}
      INACTIVE_DAYS: ${INACTIVE_DAYS:-30}
      # Webhook notifications (empty NOTIFY_URLS = off), see docs/operations.md
      NOTIFY_URLS: ${NOTIFY_URLS:-}
      NOTIFY_EVENTS: ${NOTIFY_EVENTS:-}
      # Activity log (Logs page, ./data/web/audit.db): days to keep events, 0 = forever
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
      SESSION_SECRET: ${PORTAL_SESSION_SECRET:-}
      # OIDC (empty = no SSO, API key only)
      OIDC_ISSUER: ${PORTAL_OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${PORTAL_OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${PORTAL_OIDC_CLIENT_SECRET:-}
      PORTAL_API_KEY_LOGIN: ${PORTAL_API_KEY_LOGIN:-false}
      PORTAL_ADMIN_GROUPS: ${PORTAL_ADMIN_GROUPS:-vpn-admins,authentik Admins}
      PORTAL_ADMIN_EMAILS: ${PORTAL_ADMIN_EMAILS:-}
      # Narrower roles, opt-in (empty = disabled): edits ACL + DNS only, or read-only everywhere
      PORTAL_NETWORK_ADMIN_GROUPS: ${PORTAL_NETWORK_ADMIN_GROUPS:-}
      PORTAL_AUDITOR_GROUPS: ${PORTAL_AUDITOR_GROUPS:-}
      DEMO_MODE: ${DEMO_MODE:-false}
      # Failed sign-ins allowed per client IP in the window (seconds) before a 429
      SIGNIN_RATE_LIMIT: ${SIGNIN_RATE_LIMIT:-10}
      SIGNIN_RATE_WINDOW: ${SIGNIN_RATE_WINDOW:-600}
      # To find a member's Headscale user: its providerId is <issuer>/<sub>
      HEADSCALE_OIDC_ISSUER: ${OIDC_ISSUER_URL:-}
      HEADSCALE_URL: http://headscale:${HEADSCALE_HTTP_PORT:-8080}
      HEADSCALE_API_KEY: ${HEADSCALE_API_KEY:-}
      HEADSCALE_DB: /headscale/db.sqlite
      HEADSCALE_CONFIG: /etc/headscale/config.yaml
      # Built-in Authentik: admins change the two-factor mode from Settings and
      # invite people / make password reset links from Users. The token may only
      # do that (see the blueprint).
      AUTHENTIK_URL: http://authentik-server:9000/authentik
      AUTHENTIK_API_TOKEN: ${PORTAL_AUTHENTIK_TOKEN:-}
      MFA_REQUIRED: ${MFA_REQUIRED:-admins}
      # Optional email: invitations and password reset links can be emailed
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_FROM: ${SMTP_FROM:-}
      TZ: ${TZ:-UTC}

    volumes:
      # Read-only. The Headscale API does not expose each machine's OS and
      # Tailscale version: they come from the Hostinfo in its database.
      - headscale-data:/headscale:ro
      # Writable: admins edit DNS (only the marked block).
      - ./headscale-config.yaml:/etc/headscale/config.yaml
      # Writable: the own DERP map edited on the DERP relays page
      - ./headscale-derp.yaml:/etc/headscale/derp.yaml
      # Writable: the renewed Headscale API key (see web/apikey.py), the
      # last two-factor mode set from the UI (web/mfa.py) and the activity
      # log (web/audit.py)
      - ./data/web:/data
      # hs-helper's socket: validate ('headscale configtest') and restart
      # Headscale after a DNS or key expiry change. No Docker socket here.
      - hse-helper:/run/hse-helper

    networks:
      - headscale-net

    # Runs as the owner of the project files (to write headscale-config.yaml);
    # never as root, and not in the Docker group.
    user: "${PORTAL_UID:-1000}:${PORTAL_GID:-1000}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
