name: CI

on:
  push:
    branches: [main, next]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck -S warning scripts/*.sh backup/*.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Python syntax
        run: python -m py_compile web/*.py aio/*.py scripts/check_i18n.py

      - name: Translations
        run: python scripts/check_i18n.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Project checks
        run: ./scripts/validate.sh

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the backup image
        run: docker build -t headscale-easy-backup:ci backup

  aio:
    # The all-in-one image: build, then headless and setup-mode smoke tests,
    # the built-in backups (archive, offline and online restore, a scheduled
    # run) and fail above the size / RAM targets, also during a backup
    # (scripts/aio-smoke.sh).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build the all-in-one image
        run: docker build -f aio/Dockerfile -t hse-aio:ci .

      - name: Smoke tests, backups, image size and RAM, and PostgreSQL 16, 17 and 18
        # The measured size and RAM go to the job summary (scripts/aio-smoke.sh), for the docs.
        # The PostgreSQL round starts a real server of each version (docker run): Headscale on it, the console
        # through the read-only role, a backup with its dump and a restore that loads it.
        env:
          HSE_SMOKE_PG: "1"
          HSE_SMOKE_PG_VERSIONS: "16 17 18"
        run: ./scripts/aio-smoke.sh hse-aio:ci

      - name: Build the backup sidecar
        run: docker build -t hse-backup:ci backup

      - name: The Compose app (hardened, named volumes) and the backup-remote overlay
        run: ./scripts/compose-smoke.sh hse-aio:ci hse-backup:ci

      - name: Advanced overlay, PostgreSQL 16, 17 and 18 (bundled server, read-only role, backup and restore)
        run: |
          for v in 16 17 18; do ./scripts/advanced-smoke.sh postgres "$v" hse-aio:ci || exit 1; done

      - name: Advanced overlay, a proxy in front (real nginx, real client address)
        run: ./scripts/advanced-smoke.sh proxy hse-aio:ci
