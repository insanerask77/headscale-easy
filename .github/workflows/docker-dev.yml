name: Docker image (dev)

# Publishes ghcr.io/insanerask77/headscale-easy from every branch except main, to try a branch on a server
# before merging: :next for the integration branch, :dev (the last pushed work branch) and :branch-<name>
# for the others. These are builds of a branch, not for compose.yaml: it pins a release version.
# Releases, :latest and :edge (main) come from docker.yml.
on:
  push:
    branches-ignore: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch replaces its build in progress
concurrency:
  group: docker-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: headscale-easy
            context: .
            file: aio/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=next,enable=${{ github.ref_type == 'branch' && github.ref_name == 'next' }}
            type=raw,value=dev,enable=${{ github.ref_type == 'branch' && github.ref_name != 'main' && github.ref_name != 'next' }}
            type=ref,event=branch,prefix=branch-,enable=${{ github.ref_name != 'main' && github.ref_name != 'next' }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file || format('{0}/Dockerfile', matrix.context) }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
