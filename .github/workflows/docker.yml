name: Docker image

# Publishes what 2.0 ships:
#   ghcr.io/insanerask77/headscale-easy         the all-in-one image
#   ghcr.io/insanerask77/headscale-easy-aio     the same image under its old name (an alias for one release)
#   ghcr.io/insanerask77/headscale-easy-backup  remote copies of the backups (the optional sidecar)
#   main        -> :edge
#   tag v1.2.3  -> :1.2.3, :1.2, :1, :latest
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: headscale-easy-backup
            context: backup
          - image: headscale-easy
            alias: headscale-easy-aio
            context: .
            file: aio/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
            ${{ matrix.alias && format('ghcr.io/{0}/{1}', github.repository_owner, matrix.alias) || '' }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file || format('{0}/Dockerfile', matrix.context) }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
