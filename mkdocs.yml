# Documentation site: https://insanerask77.github.io/headscale-easy/
# Preview locally:  pip install -r docs/requirements.txt && mkdocs serve
site_name: Headscale Easy
site_description: The open source Tailscale alternative — Headscale with a built-in web console, installed with one command.
site_author: Rafa Madolell
site_url: https://insanerask77.github.io/headscale-easy/
repo_url: https://github.com/insanerask77/headscale-easy
repo_name: insanerask77/headscale-easy
edit_uri: edit/main/docs/
copyright: MIT License · © 2026 <a href="https://github.com/insanerask77">Rafa Madolell</a>

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: es
          name: Español
          build: true
          nav_translations:
            Home: Inicio
            Getting started: Primeros pasos
            Configuration: Configuración
            Operations: Operación
            Project: Proyecto
            Contributing: Contribuir
            Security: Seguridad
            Changelog: Cambios

exclude_docs: |
  requirements.txt

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Configuration: configuration.md
  - Operations: operations.md
  - Project:
      - Contributing: contributing.md
      - Security: security.md
      - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/insanerask77
      name: Rafa Madolell on GitHub
    - icon: simple/buymeacoffee
      link: https://buymeacoffee.com/insanerask
      name: Buy me a coffee
    - icon: fontawesome/brands/docker
      link: https://github.com/insanerask77/headscale-easy/pkgs/container/headscale-easy
      name: Docker image
