# Documentation site: https://insanerask77.github.io/headscale-easy/
# Preview locally:  pip install -r docs/requirements.txt && mkdocs serve
site_name: Headscale Easy
site_description: Headscale, with everything around it — installer, HTTPS, accounts, a Tailscale-style web console and backups, in one command.
site_author: Rafa Madolell
site_url: https://insanerask77.github.io/headscale-easy/
repo_url: https://github.com/insanerask77/headscale-easy
repo_name: insanerask77/headscale-easy
edit_uri: edit/main/docs/
copyright: MIT License · © 2026 <a href="https://github.com/insanerask77">Rafa Madolell</a>

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: es
          name: Español
          build: true
          nav_translations:
            Home: Inicio
            Why Headscale Easy?: ¿Por qué Headscale Easy?
            Production and hardening: Producción y seguridad
            Architecture and resources: Arquitectura y recursos
            AI usage: Uso de IA
            Getting started: Primeros pasos
            All-in-one image (preview): Imagen todo en uno (preview)
            Configuration: Configuración
            Operations: Operación
            Project: Proyecto
            Contributing: Contribuir
            Roadmap: Hoja de ruta
            Security: Seguridad
            Changelog: Cambios

exclude_docs: |
  requirements.txt

nav:
  - Home: index.md
  - Why Headscale Easy?: why.md
  - Getting started: getting-started.md
  - All-in-one image (preview): all-in-one.md
  - Configuration: configuration.md
  - Operations: operations.md
  - Production and hardening: hardening.md
  - Architecture and resources: architecture.md
  - Project:
      - Contributing: contributing.md
      - Roadmap: roadmap.md
      - Security: security.md
      - AI usage: ai-usage.md
      - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/insanerask77
      name: Rafa Madolell on GitHub
    - icon: simple/kofi
      link: https://ko-fi.com/rafaelmadolell
      name: Ko-fi
    - icon: fontawesome/brands/docker
      link: https://github.com/insanerask77/headscale-easy/pkgs/container/headscale-easy
      name: Docker image
